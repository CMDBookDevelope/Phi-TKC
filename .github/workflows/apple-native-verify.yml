name: Apple 1.3.0 native verification

# Temporary validation branch. This workflow never creates a release.
on:
  push:
    branches: [ci/metal-1.3.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      PHI_TKC_APPLE_SMOKE_ARTIFACTS: ${{ runner.temp }}/apple-native-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CMDBookDevelope/prpr-miniquad
          ref: b38b8e6284e7b52ad4825dd9d5bbc4cdf87fd8b9
          path: native-deps/prpr-miniquad
      - uses: actions/checkout@v4
        with:
          repository: CMDBookDevelope/prpr-macroquad
          ref: 3ba4625944fe4c8f8794d21e7bb4d2c8a5a67e06
          path: native-deps/prpr-macroquad
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-deps/prpr-miniquad -> target
      - name: Prepare tests from actual production sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PHI_TKC_APPLE_SMOKE_ARTIFACTS"
          python3 scripts/prepare-apple-smoke.py --source "$GITHUB_WORKSPACE" \
            --deps "$GITHUB_WORKSPACE/native-deps" --output "$RUNNER_TEMP/apple-native-crate"
          cp "$RUNNER_TEMP/apple-native-crate/source-hashes.json" "$PHI_TKC_APPLE_SMOKE_ARTIFACTS/"
          sw_vers > "$PHI_TKC_APPLE_SMOKE_ARTIFACTS/machine.txt"
          sysctl -n machdep.cpu.brand_string >> "$PHI_TKC_APPLE_SMOKE_ARTIFACTS/machine.txt"
          rustc --version >> "$PHI_TKC_APPLE_SMOKE_ARTIFACTS/machine.txt"
      - name: Verify seven encoder tests, lifecycle and GPU/CoreVideo roundtrip
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --manifest-path "$RUNNER_TEMP/apple-native-crate/Cargo.toml" \
            --features apple-render-check -- --nocapture --test-threads=1 \
            2>&1 | tee "$PHI_TKC_APPLE_SMOKE_ARTIFACTS/native-tests.log"
      - name: Verify Metal rendering, export, stencil and buffer boundaries
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release --manifest-path native-deps/prpr-miniquad/Cargo.toml \
            --example metal_offscreen --features metal \
            2>&1 | tee "$PHI_TKC_APPLE_SMOKE_ARTIFACTS/metal-offscreen.log"
      - name: Compare draw allocation paths with the same binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path native-deps/prpr-miniquad/Cargo.toml \
            --example metal_bench --features metal-bench
          binary="$GITHUB_WORKSPACE/native-deps/prpr-miniquad/target/release/examples/metal_bench"
          for mode in 1 0 0 1 1 0; do
            MINIQUAD_METAL_LEGACY_DRAW="$mode" "$binary" \
              >> "$PHI_TKC_APPLE_SMOKE_ARTIFACTS/draw-metrics.jsonl"
          done
      - uses: actions/checkout@v4
        with:
          ref: 6a4d4b087d7159205eaabde02149616ca83f6c00
          path: pipeline-baseline
      - uses: actions/checkout@v4
        with:
          repository: CMDBookDevelope/Phi-TKC-render-lib
          ref: 9eebb098fe69fec9988aadd2de6e4650984d7c73
          path: native-deps/Phi-TKC-render-lib
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /prpr/
            /prpr-avc/Cargo.toml
            /prpr-avc/build.rs
            /prpr-avc/src/
            /prpr-avc/static-lib/aarch64-apple-darwin/
      - uses: actions/checkout@v4
        with:
          repository: CMDBookDevelope/prpr-miniquad
          ref: a8a2df83d8e0e45a64556f40ddb0eb145be6312a
          path: baseline-deps/prpr-miniquad
      - uses: actions/checkout@v4
        with:
          repository: CMDBookDevelope/prpr-macroquad
          ref: 3ba4625944fe4c8f8794d21e7bb4d2c8a5a67e06
          path: baseline-deps/prpr-macroquad
      - name: Prepare private chart fixture and benchmark tools
        env:
          PHI_TKC_BENCH_KEY: ${{ secrets.PHI_TKC_BENCH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "$PHI_TKC_BENCH_KEY"
          brew install openssl@3 ffmpeg
          mkdir -p "$RUNNER_TEMP/apple-pipeline/private"
          chmod 700 "$RUNNER_TEMP/apple-pipeline/private"
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/CMDBookDevelope/Phi-TKC/releases/download/v1.2.9-6a4d4b0/native-bench-41a2459a34b5e2296b81b0f5.enc \
            --output "$RUNNER_TEMP/apple-pipeline/private/fixture.enc"
          printf '%s  %s\n' \
            41c319ad77eea7de4a3b490b95766a320092f00eaa3fdc835f31ec0cccf7c506 \
            "$RUNNER_TEMP/apple-pipeline/private/fixture.enc" | shasum -a 256 --check
          crypto_bin="$(brew --prefix openssl@3)/bin/openssl"
          "$crypto_bin" enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -saltlen 8 \
            -pass env:PHI_TKC_BENCH_KEY -in "$RUNNER_TEMP/apple-pipeline/private/fixture.enc" \
            -out "$RUNNER_TEMP/apple-pipeline/private/fixture.pez"
          chmod 600 "$RUNNER_TEMP/apple-pipeline/private/fixture.pez"
          unset PHI_TKC_BENCH_KEY
          ln -s "$GITHUB_WORKSPACE/native-deps/Phi-TKC-render-lib" baseline-deps/Phi-TKC-render-lib
      - name: Compare old/new full pipelines on this Mac with the same 20s PCM
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apple-pipeline-bench.py run \
            --baseline-source "$GITHUB_WORKSPACE/pipeline-baseline" \
            --baseline-deps "$GITHUB_WORKSPACE/baseline-deps" \
            --current-source "$GITHUB_WORKSPACE" \
            --current-deps "$GITHUB_WORKSPACE/native-deps" \
            --fixture "$RUNNER_TEMP/apple-pipeline/private/fixture.pez" \
            --output "$RUNNER_TEMP/apple-pipeline" --width 1920 --height 1080 --repeat 3
          cp "$RUNNER_TEMP/apple-pipeline/pipeline-report.json" "$PHI_TKC_APPLE_SMOKE_ARTIFACTS/"
      - name: Delete private chart, videos and benchmark logs
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/apple-pipeline" "$GITHUB_WORKSPACE/pipeline-baseline"
      - name: Upload synthetic validation and numerical metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-native-verification-${{ github.sha }}
          path: ${{ runner.temp }}/apple-native-results
          if-no-files-found: error

  ios-link:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      PRPR_AVC_LIBS: ${{ github.workspace }}/prpr-lib/prpr-avc/static-lib
      IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Fetch iOS static FFmpeg libraries
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse --branch render-lib \
            https://github.com/CMDBookDevelope/Phi-TKC-render-lib.git prpr-lib
          git -C prpr-lib sparse-checkout set prpr-avc/static-lib/aarch64-apple-ios
      - run: pnpm install --frozen-lockfile
      - name: Initialize actual iOS app and icons
        run: |
          pnpm tauri ios init --ci --skip-targets-install
          python3 scripts/sync-mobile-icons.py ios
      - name: Build and link actual unsigned iOS app
        run: pnpm tauri ios build --ci --no-sign --target aarch64
      - name: Compile real PhotoKit plugin against iOS Simulator SDK
        run: bash scripts/check-ios-photos.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/photos-sdk-check"
      - name: Verify packaged resources and Photos usage key
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-ios-resources.py src-tauri/gen/apple/build/arm64/*.ipa
          python3 - <<'PY'
          import glob, plistlib, zipfile
          for path in glob.glob('src-tauri/gen/apple/build/arm64/*.ipa'):
              with zipfile.ZipFile(path) as archive:
                  names = [n for n in archive.namelist() if n.count('/') == 2 and n.endswith('.app/Info.plist')]
                  assert len(names) == 1
                  info = plistlib.loads(archive.read(names[0]))
                  assert info.get('NSPhotoLibraryAddUsageDescription')
                  print('Actual linked IPA has Photos add-only usage description')
          PY
