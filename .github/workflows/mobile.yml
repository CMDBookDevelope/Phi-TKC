name: Mobile

# Packages the mobile app:
#   iOS/iPadOS -> unsigned .ipa (sideload / re-sign locally)
#   Android    -> unsigned release .apk (no keystore configured)
#
# The mobile projects (src-tauri/gen/apple, src-tauri/gen/android) are generated by
# `tauri {ios,android} init` on the runner — they are not committed.
on:
  # A manual run builds *and* publishes a GitHub release.
  workflow_dispatch:
  # Pushes only build and upload the workflow artifacts.
  push:
    branches:
      - main
      - merge/phi-tk-upstream

permissions:
  contents: read

jobs:
  android:
    name: android-universal-apk
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PRPR_AVC_LIBS: ${{ github.workspace }}/prpr-lib/prpr-avc/static-lib
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Show Android toolchain
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK_HOME=$NDK_HOME"
          java -version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          # 32-bit ARM is intentionally not built: the Vulkan Video encoder has
          # 64-bit-only assumptions (vk handle transmutes and AV1 struct layout
          # asserts), and mobile builds do not render anyway. See AGENTS.md.
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Fetch prpr-avc static FFmpeg libs
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            --branch render-lib \
            https://github.com/CMDBookDevelope/Phi-TKC-render-lib.git prpr-lib
          git -C prpr-lib sparse-checkout set \
            prpr-avc/static-lib/aarch64-linux-android \
            prpr-avc/static-lib/armv7-linux-androideabi

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Init Android project
        run: pnpm tauri android init --ci --skip-targets-install

      - name: Bundle libc++_shared.so
        # oboe (via sasa) is built with its `shared-stdcxx` feature, so the Rust
        # cdylib has a DT_NEEDED entry for libc++_shared.so.  The Tauri Gradle
        # template only packages libapp_lib.so, and an Android app that cannot
        # resolve that library dies with UnsatisfiedLinkError before any UI shows
        # up.  Copying the NDK's copy into jniLibs makes Gradle package it.
        shell: bash
        run: |
          NDK="${ANDROID_NDK_HOME:-${NDK_HOME:-}}"
          if [ -z "${NDK}" ]; then
            NDK="$(ls -d "${ANDROID_HOME}"/ndk/* | sort -V | tail -1)"
          fi
          SRC="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          test -f "${SRC}"
          DEST="src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "${DEST}"
          cp "${SRC}" "${DEST}/libc++_shared.so"
          ls -l "${DEST}"

      - name: Build unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          # Gradle downloads its distribution on first use and that CDN regularly
          # answers 504; retry instead of failing the whole mobile release.
          for attempt in 1 2 3; do
            if pnpm tauri android build --ci --apk --target aarch64; then
              exit 0
            fi
            echo "::warning::android build failed (attempt ${attempt}/3), retrying in 30s"
            sleep 30
          done
          echo "::error::android build failed after 3 attempts"
          exit 1

      - name: Sign APK with a CI debug key
        # Mirrors Winamin/Phi-TK's android workflow: a throwaway self-signed key
        # generated on the runner, so no private key or personal identity is
        # involved (nothing to request from anyone).  Google Play signing would
        # require a developer account; that is intentionally not used.
        shell: bash
        run: |
          UNSIGNED_APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*release-unsigned.apk' -print -quit)"
          test -n "${UNSIGNED_APK}"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          BUILD_TOOLS_DIR="$(ls -d "${SDK_ROOT}"/build-tools/* | sort -V | tail -1)"
          KEYSTORE="${RUNNER_TEMP}/phi-tkc-ci.keystore"
          ALIGNED_APK="${RUNNER_TEMP}/Phi-TKC-android-arm64-aligned.apk"
          OUTPUT_APK="${GITHUB_WORKSPACE}/Phi-TKC-android-arm64.apk"

          keytool -genkeypair \
            -noprompt \
            -keystore "${KEYSTORE}" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Phi-TKC CI, OU=Android, O=Phi-TKC, L=CI, S=CI, C=CN"

          "${BUILD_TOOLS_DIR}/zipalign" -f -p 4 "${UNSIGNED_APK}" "${ALIGNED_APK}"
          "${BUILD_TOOLS_DIR}/apksigner" sign \
            --ks "${KEYSTORE}" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out "${OUTPUT_APK}" \
            "${ALIGNED_APK}"
          "${BUILD_TOOLS_DIR}/apksigner" verify --verbose "${OUTPUT_APK}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            Phi-TKC-android-arm64.apk
          if-no-files-found: error

  ios:
    name: ios-unsigned-ipa
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      PRPR_AVC_LIBS: ${{ github.workspace }}/prpr-lib/prpr-avc/static-lib
      # Same reason as desktop.yml: glslang needs std::filesystem (iOS 13+).
      IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        # Tauri's `ios init` runs `xcodegen generate`; the runners ship CocoaPods
        # but not xcodegen.
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust (iOS device target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Fetch prpr-avc static FFmpeg libs
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            --branch render-lib \
            https://github.com/CMDBookDevelope/Phi-TKC-render-lib.git prpr-lib
          git -C prpr-lib sparse-checkout set prpr-avc/static-lib/aarch64-apple-ios

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Init iOS project
        run: pnpm tauri ios init --ci --skip-targets-install

      - name: Build unsigned IPA
        run: pnpm tauri ios build --ci --no-sign --target aarch64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: src-tauri/gen/apple/build/arm64/*.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub release
    # Pushes only build the artifacts; a manual run publishes them as a release.
    if: github.event_name == 'workflow_dispatch'
    needs: [android, ios]
    runs-on: ubuntu-latest
    # Shared with desktop.yml's release job. Both workflows publish into the same
    # release for a given commit, so serialise them: whichever runs second simply
    # attaches its own artifacts to the release created by the first.
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and tag
        id: meta
        shell: bash
        run: |
          # The version lives in tauri.conf.json; it is bumped by hand, never by CI.
          version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The commit suffix keeps repeated manual runs from colliding on the tag.
          echo "tag=v$version-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AutoRelease-v${{ steps.meta.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            Phi-TKC is a Vuetify + Tauri front-end for the Phi chart renderer, rebuilt
            around a Vulkan pipeline with a glass-inspired interface.

            Published from `main` at commit `${{ github.sha }}` (version `v${{ steps.meta.outputs.version }}`).

            ## Downloads

            - **Linux (x86_64)** — `.deb`, `.AppImage`, or a portable `.tar.gz` with renderer assets. The AppImage needs FUSE 2, or run it with `--appimage-extract-and-run`.
            - **Windows (x86_64)** — NSIS installer or portable `.zip` / `.7z`, including renderer assets and WebView2Loader.dll. The GUI requires the WebView2 Runtime.
            - **macOS (Apple Silicon)** — `.dmg`, macOS 11 or newer; unsigned, so right-click → Open the first time.
            - **Android (arm64-v8a)** — `.apk`, unsigned; sign it with `apksigner` before installing.
            - **iOS / iPadOS** — unsigned `.ipa`; re-sign it with your own Apple team before sideloading.

            ## Notes

            Rendering is headless: the CLI (`Phi-TKC -i chart.pez -o out.mp4`) and the
            bundled HTTP/WebSocket server never open a window, while the GUI drives the
            same Vulkan pipeline for previews.

            CLI, server and preview terminal output shares the colored logger, including
            startup errors and per-job render diagnostics.
          # Recursive: artifact archives keep the directory layout below the
          # glob root (the APK lands in apk/universal/release/), so `dist/*`
          # would silently skip it.
          files: dist/**
