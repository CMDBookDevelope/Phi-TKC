name: Mobile

# Packages the mobile app:
#   iOS/iPadOS -> unsigned .ipa (sideload / re-sign locally)
#   Android    -> signed release .apk (CI debug key, installable)
#
# The mobile projects (src-tauri/gen/apple, src-tauri/gen/android) are generated by
# `tauri {ios,android} init` on the runner — they are not committed.
on:
  # A manual run builds *and* publishes a GitHub release.
  workflow_dispatch:
  # Pushes only build and upload the workflow artifacts.
  push:
    branches:
      - main
      - merge/phi-tk-upstream
      - android

permissions:
  contents: read

jobs:
  android:
    name: android-arm64-apk
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      NDK_VERSION: 26.1.10909125
      ANDROID_PLATFORM: "37.0"
      ANDROID_BUILD_TOOLS: 36.0.0
      CARGO_TERM_COLOR: always
    concurrency:
      group: android-apk-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          # 32-bit ARM is intentionally not built: the Vulkan Video encoder has
          # 64-bit-only assumptions (vk handle transmutes and AV1 struct layout
          # asserts), and mobile builds do not render anyway. See AGENTS.md.
          targets: aarch64-linux-android

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -mindepth 3 -maxdepth 3 \
              -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"
          fi

          if [[ -z "${SDKMANAGER}" || ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          test -n "${SDKMANAGER}"
          test -x "${SDKMANAGER}"
          yes 2>/dev/null | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses >/dev/null || true
          "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}"

          printf 'ANDROID_HOME=%s\n' "${SDK_ROOT}" >> "${GITHUB_ENV}"
          printf 'ANDROID_SDK_ROOT=%s\n' "${SDK_ROOT}" >> "${GITHUB_ENV}"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Init Android project
        run: pnpm run android:init

      # The actual build command lives in package.json (`android:build`) so that the
      # runner and a local checkout invoke *exactly* the same thing.  Keep the two in
      # sync: adding/removing an ABI means editing the script, not this file.
      - name: Build release APK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          NDK_HOME="${SDK_ROOT}/ndk/${NDK_VERSION}"
          NDK_BIN="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SHADERC_DIR="${GITHUB_WORKSPACE}/vendor/shaderc-android/lib"
          BUILD_LOG="${RUNNER_TEMP}/android-build.log"

          export ANDROID_HOME="${SDK_ROOT}"
          export ANDROID_SDK_ROOT="${SDK_ROOT}"
          export NDK_HOME
          export ANDROID_NDK_HOME="${NDK_HOME}"
          export ANDROID_NDK="${NDK_HOME}"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${NDK_BIN}/aarch64-linux-android24-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="${NDK_BIN}/llvm-ar"
          export CC_aarch64_linux_android="${NDK_BIN}/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="${NDK_BIN}/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="${NDK_BIN}/llvm-ar"
          export SHADERC_LIB_DIR="${SHADERC_DIR}"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-C link-arg=-L${SHADERC_DIR}"

          test -x "${CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER}"
          test -f "${SHADERC_DIR}/libshaderc_combined.a"
          printf 'sdk.dir=%s\n' "${SDK_ROOT}" > src-tauri/gen/android/local.properties
          chmod +x src-tauri/gen/android/gradlew

          set +e
          pnpm run android:build 2>&1 | tee "${BUILD_LOG}"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if (( BUILD_STATUS != 0 )); then
            {
              printf '### Android build failure\n\n```text\n'
              tail -n 100 "${BUILD_LOG}"
              printf '\n```\n'
            } >> "${GITHUB_STEP_SUMMARY}"

            CLEAN_LOG="${RUNNER_TEMP}/android-build-clean.log"
            sed -E 's/\x1B\[[0-9;]*[mK]//g' "${BUILD_LOG}" > "${CLEAN_LOG}"
            ERROR_LOG="$(awk '
              /^FAILURE: Build/ { exit }
              length($0) >= 1500 { next }
              /failed to build (Android app|APK):/ { next }
              /ELIFECYCLE/ { next }
              { print }
            ' "${CLEAN_LOG}" | tail -c 3500)"

            if [[ -z "${ERROR_LOG}" ]]; then
              ERROR_LOG="$(sed -n '/^FAILURE: Build/,/^BUILD FAILED/p' "${CLEAN_LOG}" | tail -c 3500)"
            fi

            ERROR_LOG="${ERROR_LOG//'%'/'%25'}"
            ERROR_LOG="${ERROR_LOG//$'\r'/'%0D'}"
            ERROR_LOG="${ERROR_LOG//$'\n'/'%0A'}"
            printf '::error title=Android build failed::%s\n' "${ERROR_LOG}"
          fi

          exit "${BUILD_STATUS}"

      - name: Sign APK with CI debug key
        shell: bash
        run: |
          UNSIGNED_APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*release-unsigned.apk' -print -quit)"
          test -n "${UNSIGNED_APK}"

          KEYSTORE="${RUNNER_TEMP}/phitk-ci.keystore"
          ALIGNED_APK="${RUNNER_TEMP}/Phi-TK-android-arm64-aligned.apk"
          OUTPUT_APK="${GITHUB_WORKSPACE}/Phi-TK-android-arm64.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          BUILD_TOOLS_DIR="${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}"

          keytool -genkeypair \
            -noprompt \
            -keystore "${KEYSTORE}" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Phi-TK CI, OU=Android, O=Phi-TK, L=CI, S=CI, C=CN"

          "${BUILD_TOOLS_DIR}/zipalign" -f -p 4 "${UNSIGNED_APK}" "${ALIGNED_APK}"
          "${BUILD_TOOLS_DIR}/apksigner" sign \
            --ks "${KEYSTORE}" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out "${OUTPUT_APK}" \
            "${ALIGNED_APK}"
          "${BUILD_TOOLS_DIR}/apksigner" verify --verbose "${OUTPUT_APK}"
          sha256sum "${OUTPUT_APK}" > "${OUTPUT_APK}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Phi-TKC-android-arm64
          path: |
            Phi-TK-android-arm64.apk
            Phi-TK-android-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 14

  ios:
    name: ios-unsigned-ipa
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      PRPR_AVC_LIBS: ${{ github.workspace }}/prpr-lib/prpr-avc/static-lib
      # Same reason as desktop.yml: glslang needs std::filesystem (iOS 13+).
      IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        # Tauri's `ios init` runs `xcodegen generate`; the runners ship CocoaPods
        # but not xcodegen.
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust (iOS device target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Fetch prpr-avc static FFmpeg libs
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            --branch render-lib \
            https://github.com/CMDBookDevelope/Phi-TK-render-lib.git prpr-lib
          git -C prpr-lib sparse-checkout set prpr-avc/static-lib/aarch64-apple-ios

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Init iOS project
        run: pnpm tauri ios init --ci --skip-targets-install

      - name: Build unsigned IPA
        run: pnpm tauri ios build --ci --no-sign --target aarch64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: src-tauri/gen/apple/build/arm64/*.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub release
    # Pushes only build the artifacts; a manual run publishes them as a release.
    if: github.event_name == 'workflow_dispatch'
    needs: [android, ios]
    runs-on: ubuntu-latest
    # Shared with desktop.yml's release job. Both workflows publish into the same
    # release for a given commit, so serialise them: whichever runs second simply
    # attaches its own artifacts to the release created by the first.
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and tag
        id: meta
        shell: bash
        run: |
          # The version lives in tauri.conf.json; it is bumped by hand, never by CI.
          version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The commit suffix keeps repeated manual runs from colliding on the tag.
          echo "tag=v$version-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AutoRelease-v${{ steps.meta.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            Phi-TKC is a Vuetify + Tauri front-end for the Phi chart renderer, rebuilt
            around a Vulkan pipeline with a glass-inspired interface.

            Published from `main` at commit `${{ github.sha }}` (version `v${{ steps.meta.outputs.version }}`).

            ## Downloads

            - **Linux (x86_64)** — `.deb` or `.AppImage`; the AppImage needs FUSE 2, or run it with `--appimage-extract-and-run`.
            - **Windows (x86_64)** — NSIS installer built with the MinGW toolchain; there is no code-signing certificate, so SmartScreen will warn.
            - **macOS (Apple Silicon)** — `.dmg`, macOS 11 or newer; unsigned, so right-click → Open the first time.
            - **Android (arm64-v8a)** — `.apk`, signed with a CI debug key; installable, but not a production signing key.
            - **iOS / iPadOS** — unsigned `.ipa`; re-sign it with your own Apple team before sideloading.

            ## Notes

            Rendering is headless: the CLI (`Phi-TKC -i chart.pez -o out.mp4`) and the
            bundled HTTP/WebSocket server never open a window, while the GUI drives the
            same Vulkan pipeline for previews.
          # Recursive: artifact archives keep the directory layout below the
          # glob root (the APK lands in apk/universal/release/), so `dist/*`
          # would silently skip it.
          files: dist/**