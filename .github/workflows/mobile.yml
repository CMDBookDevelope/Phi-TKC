name: Mobile

# Packages the mobile app:
#   iOS/iPadOS -> unsigned .ipa (sideload / re-sign locally)
#   Android    -> release .apk signed by the persistent repository release key
#
# The mobile projects (src-tauri/gen/apple, src-tauri/gen/android) are generated by
# `tauri {ios,android} init` on the runner — they are not committed.
on:
  # A manual run builds *and* publishes a GitHub release.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to update after a packaging fix (same version)'
        required: false
        type: string
  # Pushes only build and upload the workflow artifacts.
  push:
    branches:
      - main
      - merge/phi-tk-upstream

permissions:
  contents: read

jobs:
  android:
    name: android-universal-apk
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PRPR_AVC_LIBS: ${{ github.workspace }}/prpr-lib/prpr-avc/static-lib
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Validate persistent Android signing identity
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: bash scripts/sign-android-apk.sh --check-config

      - name: Show Android toolchain
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK_HOME=$NDK_HOME"
          java -version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          # 32-bit ARM is intentionally not built: the Vulkan Video encoder has
          # 64-bit-only assumptions (vk handle transmutes and AV1 struct layout
          # asserts), and mobile builds do not render anyway. See AGENTS.md.
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Fetch prpr-avc static FFmpeg libs
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            --branch render-lib \
            https://github.com/CMDBookDevelope/Phi-TKC-render-lib.git prpr-lib
          git -C prpr-lib sparse-checkout set \
            prpr-avc/static-lib/aarch64-linux-android \
            prpr-avc/static-lib/armv7-linux-androideabi

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Init Android project
        run: pnpm tauri android init --ci --skip-targets-install

      - name: Install Phi-TKC Android icons
        run: python3 scripts/sync-mobile-icons.py android

      - name: Bundle libc++_shared.so
        # oboe (via sasa) is built with its `shared-stdcxx` feature, so the Rust
        # cdylib has a DT_NEEDED entry for libc++_shared.so.  The Tauri Gradle
        # template only packages libapp_lib.so, and an Android app that cannot
        # resolve that library dies with UnsatisfiedLinkError before any UI shows
        # up.  Copying the NDK's copy into jniLibs makes Gradle package it.
        shell: bash
        run: |
          NDK="${ANDROID_NDK_HOME:-${NDK_HOME:-}}"
          if [ -z "${NDK}" ]; then
            NDK="$(ls -d "${ANDROID_HOME}"/ndk/* | sort -V | tail -1)"
          fi
          SRC="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          test -f "${SRC}"
          DEST="src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "${DEST}"
          cp "${SRC}" "${DEST}/libc++_shared.so"
          ls -l "${DEST}"

      - name: Build Android CPU ProRes encoder
        env:
          ANDROID_PRORES_BUILD_DIR: ${{ runner.temp }}/android-prores-build
        run: scripts/build-android-prores.sh

      - name: Prepare Android ProRes corresponding source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="$RUNNER_TEMP/android-prores-source"
          mkdir -p "$SOURCE_DIR/scripts" "$SOURCE_DIR/src-tauri/src"
          cp "$RUNNER_TEMP/android-prores-build/ffmpeg-7.1.4.tar.xz" "$SOURCE_DIR/"
          cp scripts/build-android-prores.sh "$SOURCE_DIR/scripts/"
          cp src-tauri/src/android_prores.c "$SOURCE_DIR/src-tauri/src/"
          cp LICENSE "$SOURCE_DIR/Phi-TKC-LICENSE-GPL-3.0.txt"
          cat > "$SOURCE_DIR/BUILD.txt" <<'EOF'
          Android arm64 ProRes encoder source

          FFmpeg 7.1.4 source is included as ffmpeg-7.1.4.tar.xz. The build script verifies
          SHA-256 71f4aac3573ed9060489cb62526a6c7dda815ae10993789611acd7be9fa9fbf4.
          FFmpeg is configured for the LGPL 2.1-or-later license. Its license text is in
          COPYING.LGPLv2.1 inside the included source archive. Phi-TKC is GPL-3.0.

          Requirements: Android NDK r27c or compatible, clang, make, tar, xz, and sha256sum.
          From this extracted directory, run:

              ANDROID_HOME=/path/to/android-sdk \
              ANDROID_NDK_HOME=/path/to/android-sdk/ndk/27.2.12479018 \
              ANDROID_PRORES_BUILD_DIR="$PWD" \
              scripts/build-android-prores.sh "$PWD/jniLibs/arm64-v8a"

          The generated libphitkc_prores.so is loaded dynamically by Phi-TKC on Android.
          EOF
          tar -cJf Phi-TKC-android-prores-source.tar.xz \
            -C "$RUNNER_TEMP" android-prores-source

      - name: Build unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          # Gradle downloads its distribution on first use and that CDN regularly
          # answers 504; retry instead of failing the whole mobile release.
          for attempt in 1 2 3; do
            if pnpm tauri android build --ci --apk --target aarch64; then
              exit 0
            fi
            echo "::warning::android build failed (attempt ${attempt}/3), retrying in 30s"
            sleep 30
          done
          echo "::error::android build failed after 3 attempts"
          exit 1

      - name: Sign APK with persistent release key
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: bash scripts/sign-android-apk.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            Phi-TKC-android-arm64.apk
            Phi-TKC-android-prores-source.tar.xz
          if-no-files-found: error

  ios:
    name: ios-unsigned-ipa
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      PRPR_AVC_LIBS: ${{ github.workspace }}/prpr-lib/prpr-avc/static-lib
      # Same reason as desktop.yml: glslang needs std::filesystem (iOS 13+).
      IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        # Tauri's `ios init` runs `xcodegen generate`; the runners ship CocoaPods
        # but not xcodegen.
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust (iOS device target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Fetch prpr-avc static FFmpeg libs
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            --branch render-lib \
            https://github.com/CMDBookDevelope/Phi-TKC-render-lib.git prpr-lib
          git -C prpr-lib sparse-checkout set prpr-avc/static-lib/aarch64-apple-ios

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Init iOS project
        run: pnpm tauri ios init --ci --skip-targets-install

      - name: Install Phi-TKC iOS icons
        run: python3 scripts/sync-mobile-icons.py ios

      - name: Test iOS renderer resource validation
        run: python3 scripts/check-ios-resources.py --self-test

      - name: Build unsigned IPA
        run: pnpm tauri ios build --ci --no-sign --target aarch64

      - name: Compile PhotoKit plugin against real iOS SDK
        run: bash scripts/check-ios-photos.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/photos-sdk-check"

      - name: Verify renderer resources in IPA
        run: python3 scripts/check-ios-resources.py src-tauri/gen/apple/build/arm64/*.ipa

      - name: Verify linked PhotoKit, album permission, and ProMotion opt-in
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, pathlib, plistlib, subprocess, tempfile, zipfile
          packages = glob.glob('src-tauri/gen/apple/build/arm64/*.ipa')
          assert packages, 'No linked iOS application was produced'
          for package in packages:
              with zipfile.ZipFile(package) as archive:
                  names = [n for n in archive.namelist() if n.count('/') == 2 and n.endswith('.app/Info.plist')]
                  assert len(names) == 1, 'Expected one application Info.plist'
                  info = plistlib.loads(archive.read(names[0]))
                  assert info.get('NSPhotoLibraryAddUsageDescription'), 'Missing album addition permission description'
                  assert info.get('CADisableMinimumFrameDurationOnPhone') is True, 'Missing iPhone ProMotion opt-in'
                  binary_name = names[0].rsplit('/', 1)[0] + '/' + info['CFBundleExecutable']
                  with tempfile.TemporaryDirectory() as folder:
                      binary = pathlib.Path(folder) / 'app-binary'
                      binary.write_bytes(archive.read(binary_name))
                      linked = subprocess.check_output(['otool', '-L', str(binary)], text=True)
                      assert 'Photos.framework/Photos' in linked, 'PhotoKit is absent from the actual app linkage'
                  print('Actual IPA has linked PhotoKit, album permission, and iPhone ProMotion opt-in')
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: src-tauri/gen/apple/build/arm64/*.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub release
    # Pushes only build the artifacts; a manual run publishes them as a release.
    if: github.event_name == 'workflow_dispatch'
    needs: [android, ios]
    runs-on: ubuntu-latest
    # Shared with desktop.yml's release job. Both workflows publish into the same
    # release for a given commit, so serialise them: whichever runs second simply
    # attaches its own artifacts to the release created by the first.
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and tag
        id: meta
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          # The version lives in tauri.conf.json; it is bumped by hand, never by CI.
          version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ -n "$REQUESTED_RELEASE_TAG" ]]; then
            suffix="${REQUESTED_RELEASE_TAG##*-}"
            if [[ "$REQUESTED_RELEASE_TAG" != "v$version-$suffix" || ! "$suffix" =~ ^[0-9a-f]{7}$ ]]; then
              echo "::error::release_tag must be an existing v${version}-<7-char lowercase SHA> tag"
              exit 1
            fi
            tag="$REQUESTED_RELEASE_TAG"
          else
            # The commit suffix keeps repeated manual runs from colliding on the tag.
            tag="v$version-${GITHUB_SHA::7}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download Android packages and corresponding source
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-input/android

      - name: Download the iOS package
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release-input/ios

      - name: Stage release packages
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: python3 scripts/stage-release-assets.py mobile "$RELEASE_VERSION" release-input release-assets

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AutoRelease-v${{ steps.meta.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            Phi-TKC is a Vuetify + Tauri front-end for the Phi chart renderer, rebuilt
            around a Vulkan pipeline with a glass-inspired interface.

            Published from `main` at commit `${{ github.sha }}` (version `v${{ steps.meta.outputs.version }}`).

            ## Downloads

            - **Linux (x86_64)** — `.deb`, `.AppImage`, or a portable `.tar.gz` with renderer assets. The AppImage needs FUSE 2, or run it with `--appimage-extract-and-run`.
            - **Windows (x86_64)** — NSIS installer or portable `.zip` / `.7z`, including renderer assets and WebView2Loader.dll. The GUI requires the WebView2 Runtime.
            - **macOS (Apple Silicon)** — `.dmg`, macOS 11 or newer; unsigned, so right-click → Open the first time.
            - **Android (arm64-v8a)** — `.apk`, signed with a persistent release key. Updates from v1.3.8 onward install over the existing app; older releases need one reinstall because they used temporary signing keys.
            - **Android ProRes source** — GPL/LGPL source archive and reproducible FFmpeg build script for `libphitkc_prores.so`.
            - **iOS / iPadOS** — unsigned `.ipa`; re-sign it with your own Apple team before sideloading.

            ## Notes

            Rendering is headless: the CLI (`Phi-TKC -i chart.pez -o out.mp4`) and the
            bundled HTTP/WebSocket server never open a window, while the GUI drives the
            same Vulkan pipeline for previews.

            CLI, server and preview terminal output shares the colored logger, including
            startup errors and per-job render diagnostics.
          fail_on_unmatched_files: true
          files: release-assets/*
