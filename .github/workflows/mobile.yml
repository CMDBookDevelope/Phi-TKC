name: Mobile

# Packages the mobile app:
#   iOS/iPadOS -> unsigned .ipa (sideload / re-sign locally)
#   Android    -> unsigned release .apk (no keystore configured)
#
# The mobile projects (src-tauri/gen/apple, src-tauri/gen/android) are generated by
# `tauri {ios,android} init` on the runner — they are not committed.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - merge/phi-tk-upstream
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  android:
    name: android-universal-apk
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PRPR_AVC_LIBS: ${{ github.workspace }}/prpr-lib/prpr-avc/static-lib
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Show Android toolchain
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK_HOME=$NDK_HOME"
          java -version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Fetch prpr-avc static FFmpeg libs
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            --branch render-lib \
            https://github.com/CMDBookDevelope/Phi-TK-render-lib.git prpr-lib
          git -C prpr-lib sparse-checkout set \
            prpr-avc/static-lib/aarch64-linux-android \
            prpr-avc/static-lib/armv7-linux-androideabi

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Init Android project
        run: pnpm tauri android init --ci --skip-targets-install

      - name: Build unsigned release APK
        run: pnpm tauri android build --ci --apk --target aarch64 --target armv7

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          # No keystore is configured, so the file is app-universal-release-unsigned.apk.
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error

  ios:
    name: ios-unsigned-ipa
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      PRPR_AVC_LIBS: ${{ github.workspace }}/prpr-lib/prpr-avc/static-lib
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        # Tauri's `ios init` runs `xcodegen generate`; the runners ship CocoaPods
        # but not xcodegen.
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust (iOS device target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Fetch prpr-avc static FFmpeg libs
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            --branch render-lib \
            https://github.com/CMDBookDevelope/Phi-TK-render-lib.git prpr-lib
          git -C prpr-lib sparse-checkout set prpr-avc/static-lib/aarch64-apple-ios

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Init iOS project
        run: pnpm tauri ios init --ci --skip-targets-install

      - name: Build unsigned IPA
        run: pnpm tauri ios build --ci --no-sign --target aarch64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: src-tauri/gen/apple/build/arm64/*.ipa
          if-no-files-found: error

  release:
    name: Attach to draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    # Shared with desktop.yml's release job (see comment there).
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
