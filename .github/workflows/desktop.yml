name: Desktop

# Packages the desktop app:
#   Windows -> NSIS setup wizard (.exe) + portable .zip / .7z
#   Linux   -> deb + AppImage + portable .tar.gz
#   macOS   -> dmg (Apple Silicon only; no x86_64-apple-darwin FFmpeg static libs exist)
#
# Why one job per OS instead of "cross-compile everything on a macOS runner":
#   * Tauri does not support cross-compiling to Linux from macOS: the deb/AppImage
#     bundlers shell out to Linux tools (dpkg-deb, linuxdeploy, FUSE) and the binary
#     must link against the target glibc.
#   * Windows NSIS from macOS is likewise unsupported by tauri-action; it needs a
#     Windows (or MinGW) toolchain and makensis.
#   * iOS/IPA *does* require macOS, and Android runs on any host with the SDK —
#     both live in mobile.yml, which is triggered alongside this workflow.
on:
  # A manual run builds *and* publishes a GitHub release.
  workflow_dispatch:
  # Pushes only build and upload the workflow artifacts.
  push:
    branches:
      - main
      - merge/phi-tk-upstream

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x86_64-nsis
            platform: windows-latest
            # prpr-avc only ships ffmpeg static libs for the GNU triple, so the whole
            # app is built with the MinGW toolchain (this is what the old CI did).
            toolchain: stable-x86_64-pc-windows-gnu
            rust-target: x86_64-pc-windows-gnu
            # `--target` has to be explicit. Without it tauri CLI (<= 2.11.x) hands
            # the bundler the triple it was compiled for (msvc), and the NSIS step
            # that adds WebView2Loader.dll for -gnu builds is skipped - the
            # installer then ships an app that cannot start.
            args: --target x86_64-pc-windows-gnu --bundles nsis
            artifact: desktop-windows-nsis
            files: |
              src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*.exe
              dist-portable/*.zip
              dist-portable/*.7z
          - label: linux-x86_64-deb
            # 22.04 keeps the deb's glibc requirement low enough for older distros.
            platform: ubuntu-22.04
            toolchain: stable
            rust-target: x86_64-unknown-linux-gnu
            args: --bundles deb
            artifact: desktop-linux-deb
            files: |
              src-tauri/target/release/bundle/deb/*.deb
              dist-portable/*.tar.gz
          - label: linux-x86_64-appimage
            platform: ubuntu-22.04
            toolchain: stable
            rust-target: x86_64-unknown-linux-gnu
            args: --bundles appimage
            artifact: desktop-linux-appimage
            files: src-tauri/target/release/bundle/appimage/*.AppImage
          - label: macos-arm64-dmg
            platform: macos-latest
            toolchain: stable
            rust-target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
            artifact: desktop-macos-dmg
            files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
    env:
      # prpr-avc's build.rs appends /<target-triple> to this path.
      PRPR_AVC_LIBS: ${{ github.workspace }}/prpr-lib/prpr-avc/static-lib
      # linuxdeploy is itself an AppImage; without FUSE on the runner it has to
      # extract-and-run instead of mounting.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      # shaderc-sys compiles glslang, which uses std::filesystem (macOS 10.15+).
      # cc-rs defaults to an older deployment target, so set it explicitly or the
      # macOS build fails with "'path' is unavailable: introduced in macOS 10.15".
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          apt_get() {
            sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"
          }
          use_ubuntu_archive() {
            # Hosted runners also use mirror+file sources whose URLs live in
            # separate apt-mirrors lists rather than in the source definitions.
            for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors*.txt; do
              if [ -f "$source" ]; then
                sudo sed -i -E 's#https?://azure\.archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' "$source"
              fi
            done
          }
          # The runner's Azure mirror can fail DNS resolution. apt-get otherwise
          # keeps stale indexes and retries every package against that same host.
          if ! timeout 15s getent hosts azure.archive.ubuntu.com >/dev/null; then
            use_ubuntu_archive
          fi
          if ! apt_get -o APT::Update::Error-Mode=any update; then
            use_ubuntu_archive
            apt_get -o APT::Update::Error-Mode=any update
          fi
          apt_get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            libswresample-dev \
            libavfilter-dev \
            libavdevice-dev \
            zlib1g-dev \
            libfuse2 \
            build-essential

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Fetch prpr-avc static FFmpeg libs
        shell: bash
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            --branch render-lib \
            https://github.com/CMDBookDevelope/Phi-TKC-render-lib.git prpr-lib
          git -C prpr-lib sparse-checkout set "prpr-avc/static-lib/${{ matrix.rust-target }}"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Apple native rendering and MP4 encoding
        if: matrix.rust-target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib \
            --features apple-render-check apple_media::tests::videotoolbox_mp4_smoke
          MINIQUAD_MANIFEST="$(cargo metadata --locked --manifest-path src-tauri/Cargo.toml \
            --format-version 1 | python3 -c 'import json,sys; print(next(p["manifest_path"] for p in json.load(sys.stdin)["packages"] if p["name"] == "miniquad"))')"
          cargo run --manifest-path "$MINIQUAD_MANIFEST" --example metal_offscreen --features metal

      - name: Build bundles
        shell: bash
        run: |
          set -euo pipefail
          # Tauri fetches the NSIS / AppImage bundler tools on first use, and that
          # CDN answers with a 5xx often enough to have failed whole releases.
          # The build itself is idempotent, so retry it instead of going red on a
          # transient download error.
          if [ "${{ runner.os }}" = Windows ]; then
            # Resolve the final executable's DLL graph before NSIS is generated.
            build_args=(--target x86_64-pc-windows-gnu --no-bundle)
          else
            build_args=(${{ matrix.args }})
          fi
          for attempt in 1 2 3; do
            if pnpm tauri build "${build_args[@]}"; then
              exit 0
            fi
            echo "::warning::tauri build failed (attempt ${attempt}/3), retrying in 20s"
            sleep 20
          done
          echo "::error::tauri build failed after 3 attempts"
          exit 1

      - name: Collect Windows runtime dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-windows-runtime.py
          python3 scripts/windows-runtime.py collect \
            --binary src-tauri/target/x86_64-pc-windows-gnu/release/Phi-TKC.exe \
            --output dist-windows-runtime \
            --tauri-config src-tauri/target/windows-runtime-tauri.json

      - name: Bundle Windows installer with runtime dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if pnpm tauri bundle --target x86_64-pc-windows-gnu --bundles nsis \
                --config src-tauri/target/windows-runtime-tauri.json; then
              exit 0
            fi
            echo "::warning::Windows bundling failed (attempt ${attempt}/3), retrying in 20s"
            sleep 20
          done
          exit 1

      - name: Package Linux portable archive
        if: matrix.label == 'linux-x86_64-deb'
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          python3 scripts/package-portable.py --app Phi-TKC --version "$version" \
            --target linux_x86_64 --binary src-tauri/target/release/Phi-TKC \
            --assets src-tauri/assets --output dist-portable
          tar -tzf dist-portable/*.tar.gz > portable-files.txt
          grep -q '/assets/ending.mp3$' portable-files.txt

      - name: Package Windows portable archives
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          # All three formats use the resolved DLL closure, not the subset that
          # an installer happened to include before dependency collection.
          # NSIS writes Tauri bundle metadata into its executable. Copy that
          # final executable too so every package contains the same payload.
          setup=$(ls src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*.exe | head -n 1)
          7z x "$setup" -oportable-installer -y
          installed_binary=$(find portable-installer -type f -iname Phi-TKC.exe -print -quit)
          test -n "$installed_binary"
          dll_args=()
          while IFS= read -r dll; do
            dll_args+=(--runtime-dll "$dll")
          done < <(find dist-windows-runtime -type f -iname '*.dll' ! -iname WebView2Loader.dll)
          python3 scripts/package-portable.py --app Phi-TKC --version "$version" \
            --target windows_x86_64 \
            --binary "$installed_binary" \
            --assets src-tauri/assets --output dist-portable \
            --webview-loader dist-windows-runtime/WebView2Loader.dll "${dll_args[@]}"
          7z t dist-portable/*.zip

      - name: Verify Windows installer and portable packages in isolation
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          archives=()
          for archive in src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*.exe dist-portable/*.zip dist-portable/*.7z; do
            archives+=(--archive "$archive")
          done
          python3 scripts/check-windows-package.py --version "$version" \
            "${archives[@]}" --report dist-portable/windows-runtime-check.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    # Pushes only build the artifacts; a manual run publishes them as a release.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    # Shared with mobile.yml's release job. Both workflows publish into the same
    # release for a given commit, so serialise them: whichever runs second simply
    # attaches its own artifacts to the release created by the first.
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and tag
        id: meta
        shell: bash
        run: |
          # The version lives in tauri.conf.json; it is bumped by hand, never by CI.
          version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The commit suffix keeps repeated manual runs from colliding on the tag.
          echo "tag=v$version-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AutoRelease-v${{ steps.meta.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            Phi-TKC is a Vuetify + Tauri front-end for the Phi chart renderer, rebuilt
            around a Vulkan pipeline with a glass-inspired interface.

            Published from `main` at commit `${{ github.sha }}` (version `v${{ steps.meta.outputs.version }}`).

            ## Downloads

            - **Linux (x86_64)** — `.deb`, `.AppImage`, or a portable `.tar.gz` with renderer assets. The AppImage needs FUSE 2, or run it with `--appimage-extract-and-run`.
            - **Windows (x86_64)** — NSIS installer or portable `.zip` / `.7z`, including renderer assets and WebView2Loader.dll. The GUI requires the WebView2 Runtime.
            - **macOS (Apple Silicon)** — `.dmg`, macOS 11 or newer; unsigned, so right-click → Open the first time.
            - **Android (arm64-v8a)** — `.apk`, unsigned; sign it with `apksigner` before installing.
            - **iOS / iPadOS** — unsigned `.ipa`; re-sign it with your own Apple team before sideloading.

            ## Notes

            Rendering is headless: the CLI (`Phi-TKC -i chart.pez -o out.mp4`) and the
            bundled HTTP/WebSocket server never open a window, while the GUI drives the
            same Vulkan pipeline for previews.

            CLI, server and preview terminal output shares the colored logger, including
            startup errors and per-job render diagnostics.
          # Recursive: artifact archives keep the directory layout below the
          # glob root (the APK lands in apk/universal/release/), so `dist/*`
          # would silently skip it.
          files: dist/**
