name: Desktop

# Packages the desktop app:
#   Windows -> NSIS setup wizard (.exe)
#   Linux   -> deb + AppImage
#   macOS   -> dmg (Apple Silicon only; no x86_64-apple-darwin FFmpeg static libs exist)
#
# Why one job per OS instead of "cross-compile everything on a macOS runner":
#   * Tauri does not support cross-compiling to Linux from macOS: the deb/AppImage
#     bundlers shell out to Linux tools (dpkg-deb, linuxdeploy, FUSE) and the binary
#     must link against the target glibc.
#   * Windows NSIS from macOS is likewise unsupported by tauri-action; it needs a
#     Windows (or MinGW) toolchain and makensis.
#   * iOS/IPA *does* require macOS, and Android runs on any host with the SDK —
#     both live in mobile.yml, which is triggered alongside this workflow.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - merge/phi-tk-upstream
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x86_64-nsis
            platform: windows-latest
            # prpr-avc only ships ffmpeg static libs for the GNU triple, so the whole
            # app is built with the MinGW toolchain (this is what the old CI did).
            toolchain: stable-x86_64-pc-windows-gnu
            rust-target: x86_64-pc-windows-gnu
            args: --bundles nsis
            artifact: desktop-windows-nsis
            files: src-tauri/target/release/bundle/nsis/*.exe
          - label: linux-x86_64-deb
            # 22.04 keeps the deb's glibc requirement low enough for older distros.
            platform: ubuntu-22.04
            toolchain: stable
            rust-target: x86_64-unknown-linux-gnu
            args: --bundles deb
            artifact: desktop-linux-deb
            files: src-tauri/target/release/bundle/deb/*.deb
          - label: linux-x86_64-appimage
            platform: ubuntu-22.04
            toolchain: stable
            rust-target: x86_64-unknown-linux-gnu
            args: --bundles appimage
            artifact: desktop-linux-appimage
            files: src-tauri/target/release/bundle/appimage/*.AppImage
          - label: macos-arm64-dmg
            platform: macos-latest
            toolchain: stable
            rust-target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
            artifact: desktop-macos-dmg
            files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
    env:
      # prpr-avc's build.rs appends /<target-triple> to this path.
      PRPR_AVC_LIBS: ${{ github.workspace }}/prpr-lib/prpr-avc/static-lib
      # linuxdeploy is itself an AppImage; without FUSE on the runner it has to
      # extract-and-run instead of mounting.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            libswresample-dev \
            libavfilter-dev \
            libavdevice-dev \
            zlib1g-dev \
            libfuse2 \
            build-essential

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Fetch prpr-avc static FFmpeg libs
        shell: bash
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            --branch render-lib \
            https://github.com/CMDBookDevelope/Phi-TK-render-lib.git prpr-lib
          git -C prpr-lib sparse-checkout set "prpr-avc/static-lib/${{ matrix.rust-target }}"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundles
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Attach to draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # Shared with mobile.yml's release job: both workflows attach their artifacts to
    # the same tag's draft release, so creating/updating must not race.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
